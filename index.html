<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./bootstrap_5_0_2_dist/css/bootstrap.min.css">
  <style>
    .btn-outline-secondary:hover {
      background-color: transparent !important;
      color: #6c757d;
      /* keep original text color */
      border-color: #6c757d;
    }

    .btn:focus,
    .btn:active,
    .btn:focus-visible {
      box-shadow: none !important;
    }
  </style>
</head>

<body>



</body>

<body class="">
  <!-- Site wrapper -->
  <div class="wrapper">


    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">


      <br>
      <div class="row">
        <div class="col-md-1"></div>
        <div class="col-md-10">
          <button type="button" id="switch_kiril_latin" class="btn btn-success">Кирилл-Латин</button>
          <button type="button" id="switch_latin_kiril" class="btn btn-outline-secondary">Латин-Кирилл</button>
          <button type="button" id="switch_sentence_case" class="btn btn-outline-secondary"> Sentence case</button>
          <button type="button" id="switch_lower_case" class="btn btn-outline-secondary"> lower case</button>
          <button type="button" id="switch_upper_case" class="btn btn-outline-secondary"> UPPER CASE</button>
          <button type="button" id="switch_capitalized_case" class="btn btn-outline-secondary"> Capitalized
            Case</button>
        </div>
        <div class="col-md-1"></div>
      </div>
      <div class="row">
        <div class="col-md-1"></div>
        <div class="col-md-5">

          <label for="from-text">Введите текст (Макс. длина: 5000)</label>
          <textarea name="from_text" id="input_textarea" maxlength="5000" cols="30" rows="10"
            class="form-control"></textarea>
          <div class="form-text text-right text-muted" id="form-text-info">
            <small id="from-text-current">0</small>/<small>5000</small>
          </div>


          <button id="convert_btn" class="btn btn-primary btn-lg form-send-btn" type="submit">
            Конвертировать </button>
          <br>
        </div>
        <div class="col-md-5">

          <label for="to-text">Результат</label>
          <textarea name="to-text" id="output_textarea" cols="30" rows="10" class="form-control" readonly=""
            style="height: 250px;"></textarea>
          <div class="form-text text-right text-muted" id="to-text-info">
            <small>&nbsp;</small>
          </div>


          <button class="btn btn-primary btn-lg" id="copy_btn" type="button" data-copy="to-text"
            data-copied-text="Cкопировано">
            Cкопировать </button>

          <br>
        </div>
        <div class="col-md-1"></div>
      </div>


    </div>


  </div>

  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3">
  </div>
  <script src="./bootstrap_5_0_2_dist/js/bootstrap.min.js"></script>

  <script src="./js/translate.js"></script>

</body>

</html>
